    - heading "Principles" [level=2] [ref=e2128]
    - paragraph [ref=e2129]: What makes a screen feel like this system rather than a generic dark dashboard.
    - generic [ref=e2130]:
      - generic [ref=e2131]:
        - generic [ref=e2132]: Density is the point
        - list [ref=e2133]:
          - listitem [ref=e2134]: 31px rows, 13px text, hairlines only. No zebra striping, no card per row.
          - listitem [ref=e2135]: Pack the sidebar with counts in parentheses; that is the scan aid.
          - listitem [ref=e2136]: Values are text-2 grey; only the exception gets a color.
      - generic [ref=e2137]:
        - generic [ref=e2138]: Blue means "you can act here"
        - list [ref=e2139]:
          - listitem [ref=e2140]: Links, active tabs, checked boxes, primary buttons, the selected row edge, the sorted header.
          - listitem [ref=e2141]: Never use blue as decoration or as a data color except for download.
      - generic [ref=e2142]:
        - generic [ref=e2143]: Status is small
        - list [ref=e2144]:
          - listitem [ref=e2145]: A 6px dot, a chip, or a colored word. Never a tinted row or a giant badge.
          - listitem [ref=e2146]: Green good, yellow ok, orange fair, red bad, grey offline.
      - generic [ref=e2147]:
        - generic [ref=e2148]: Three surfaces, nothing else
        - list [ref=e2149]:
          - listitem [ref=e2150]: Page, surface, raised. Depth comes from the step between them, not from shadows or borders.
          - listitem [ref=e2151]: Cards have no border. Inputs have no border until focused.
      - generic [ref=e2152]:
        - generic [ref=e2153]: Labels are quiet, numbers are tabular
        - list [ref=e2154]:
          - listitem [ref=e2155]: 11px grey labels, 11px bold section titles, slashed zeros everywhere.
          - listitem [ref=e2156]: Right-align numeric columns and give them units.
      - generic [ref=e2157]:
        - generic [ref=e2158]: Destructive is a link
        - list [ref=e2159]:
          - listitem [ref=e2160]: Reconnect / Block / Remove are red text, stacked at the end of a drawer.
          - listitem [ref=e2161]: Confirm in a modal; never in a toast.
